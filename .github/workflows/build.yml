name: iOS Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6.0"

      - name: Install OpenSSL.xcframework
        run: |
          set -e
          mkdir -p OpenSSL/Frameworks/iphoneos
          if [ ! -d "OpenSSL/Frameworks/OpenSSL.xcframework" ]; then
            echo "Downloading OpenSSL.xcframework..."
            curl -L --fail --retry 3 \
              -o /tmp/openssl.zip \
              "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.5000/OpenSSL.xcframework.zip"
            unzip -q /tmp/openssl.zip -d /tmp/openssl
            cp -R /tmp/openssl/OpenSSL.xcframework OpenSSL/Frameworks/
          fi
          # Provide the loose iOS OpenSSL.framework expected by DEVELOPMENT_ASSET_PATHS (ZSign links against it)
          if [ ! -d "OpenSSL/Frameworks/iphoneos/OpenSSL.framework" ]; then
            SLICE=$(find "OpenSSL/Frameworks/OpenSSL.xcframework" -maxdepth 1 -type d -name "ios-*" ! -name "*simulator*" ! -name "*maccatalyst*" | head -n 1)
            echo "Using xcframework slice: $SLICE"
            cp -R "$SLICE/OpenSSL.framework" OpenSSL/Frameworks/iphoneos/
          fi
          ls -d OpenSSL/Frameworks/OpenSSL.xcframework OpenSSL/Frameworks/iphoneos/OpenSSL.framework

      - name: Build and Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild clean archive \
            -project "LiveContainer.xcodeproj" \
            -scheme "LiveContainer" \
            -configuration Release \
            -archivePath "$PWD/build/LiveContainer.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log

      - name: Create IPA
        run: |
          set -o pipefail
          mkdir -p build/Payload
          APP_PATH=$(find "$PWD/build/LiveContainer.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app found in archive" >&2
            exit 1
          fi
          echo "Found app: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -qr LiveContainer.ipa Payload
          rm -rf Payload
          ls -lh LiveContainer.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveContainer.ipa
          path: build/LiveContainer.ipa
          retention-days: 7
